[package]
name = "rustnumpy-python"
version = "0.1.0"
edition = "2021"
description = "Python package `rustnumpy`: a standalone NumPy-style array library built on the rustnumpy core."
license = "MIT OR Apache-2.0"

[lib]
# cdylib: what maturin builds into an importable .so/.pyd for Python.
# rlib: kept so `cargo test`/`cargo check` in this directory still work
# as a normal Rust crate without going through Python at all.
name = "rustnumpy_python"
crate-type = ["cdylib", "rlib"]

[dependencies]
rustnumpy = { path = ".." }
num-complex = "0.4"
half = { version = "2", features = ["num-traits"] }
num-traits = "0.2"
pyo3 = { version = "0.26", features = ["extension-module", "multiple-pymethods"] }
